name: Build Native Linux ARM64 Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Pi4 repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev

      - name: Install Flutter 3.44.7 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --enable-linux-desktop
          "$HOME/flutter/bin/flutter" precache --linux

      - name: Prepare native-only source
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/lib/main.dart")
          s = p.read_text(encoding="utf-8")

          # Remove V6 only in this CI workspace, if it is currently present.
          v6_start = (
              "    // Pi 4 performance fix:\n"
              "    // Keep the original RecipeCard/UI exactly as designed, but make the\n"
              "    // scrolling overview itself opaque so SkWasm does not have to composite\n"
              "    // the transparent scroll surface over the global theme background.\n"
              "    return ColoredBox(\n"
              "      color: store.appColors.backgroundColor,\n"
              "      child: SafeArea(\n"
              "        child: CustomScrollView(\n"
              "          slivers: [\n"
          )
          original_start = (
              "    return SafeArea(\n"
              "      child: CustomScrollView(\n"
              "        slivers: [\n"
          )
          if v6_start in s:
              s = s.replace(v6_start, original_start, 1)
              v6_end = (
                  "          ],\n"
                  "        ),\n"
                  "      ),\n"
                  "    );\n"
              )
              original_end = (
                  "        ],\n"
                  "      ),\n"
                  "    );\n"
              )
              if v6_end not in s:
                  raise SystemExit("V6 end marker not found while restoring original UI")
              s = s.replace(v6_end, original_end, 1)

          # Native Linux has no browser same-origin URL.
          old = (
              "  Uri _apiUri(String path) {\n"
              "    final configuredHost = wifiHost.trim();\n"
              "\n"
              "    // Im Raspberry-Kiosk werden Flutter-Web-App und GPIO-API vom selben\n"
              "    // lokalen Dienst ausgeliefert. Leer = Same-Origin.\n"
              "    if (configuredHost.isEmpty) {\n"
              "      return Uri.base.resolve(path);\n"
              "    }\n"
          )
          new = (
              "  Uri _apiUri(String path) {\n"
              "    final configuredHost = wifiHost.trim();\n"
              "    const nativeApiBase =\n"
              "        String.fromEnvironment('COCKTAILBOT_NATIVE_API_BASE');\n"
              "\n"
              "    // Web: leer = Same-Origin; Native-Test: lokales Backend.\n"
              "    if (configuredHost.isEmpty) {\n"
              "      if (nativeApiBase.isNotEmpty) {\n"
              "        final nativeBase = Uri.parse(\n"
              "          nativeApiBase.endsWith('/') ? nativeApiBase : '$nativeApiBase/',\n"
              "        );\n"
              "        return nativeBase.resolve(\n"
              "          path.startsWith('/') ? path.substring(1) : path,\n"
              "        );\n"
              "      }\n"
              "      return Uri.base.resolve(path);\n"
              "    }\n"
          )
          if old not in s:
              raise SystemExit("_apiUri source block not found; native test patch aborted")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate Linux runner and build release
        shell: bash
        working-directory: app
        run: |
          set -euxo pipefail
          flutter pub get
          flutter create \
            --platforms=linux \
            --project-name cocktailbot_app \
            .
          flutter build linux \
            --release \
            --dart-define=COCKTAILBOT_NATIVE_API_BASE=http://127.0.0.1:8080

      - name: Package native bundle
        shell: bash
        run: |
          set -euxo pipefail
          BINARY="$(find app/build/linux -type f -name cocktailbot_app -perm -111 | head -n 1)"
          test -n "$BINARY"
          BUNDLE_DIR="$(dirname "$BINARY")"

          rm -rf /tmp/cocktailbot-native-package
          mkdir -p /tmp/cocktailbot-native-package
          cp -a "$BUNDLE_DIR"/. /tmp/cocktailbot-native-package/

          tar -C /tmp/cocktailbot-native-package \
            -czf /tmp/cocktailbot-linux-arm64-test.tar.gz .
          sha256sum /tmp/cocktailbot-linux-arm64-test.tar.gz \
            > /tmp/cocktailbot-linux-arm64-test.tar.gz.sha256

          file "$BINARY"
          ls -lh /tmp/cocktailbot-linux-arm64-test.tar.gz

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocktailbot-linux-arm64-test
          path: |
            /tmp/cocktailbot-linux-arm64-test.tar.gz
            /tmp/cocktailbot-linux-arm64-test.tar.gz.sha256
          retention-days: 7

      - name: Publish test bundle branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/native-branch
          mkdir /tmp/native-branch
          cd /tmp/native-branch

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp /tmp/cocktailbot-linux-arm64-test.tar.gz .
          cp /tmp/cocktailbot-linux-arm64-test.tar.gz.sha256 .

          cat > README.txt <<'EOF'
          CocktailBot native Linux ARM64 performance test.
          Generated automatically from the Pi4 repository.
          This branch is a test artifact only.
          EOF

          git add .
          git commit -m "Native Linux ARM64 test build"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git branch -M native-linux-arm64-test
          git push --force origin native-linux-arm64-test
